name: Native JavaScript runtime and release builds

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-contract:
    name: QuickJS and release (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      # pdfx's nested pdfium configure needs this floor with CMake 4.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config \
            libmpv-dev mpv
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      # Bootstrap FVM using the action's Dart SDK; project commands use FVM.
      - run: dart pub global activate fvm
      - run: fvm use 3.44.4 --force
      - run: fvm flutter config --enable-${{ matrix.platform }}-desktop
      - run: fvm flutter pub get
      # Flutter test compiles and loads the native asset on each runner. The
      # contract executes C11 cancellation, timeout, allocation and disposal.
      - name: Verify native engine, public API and real HTTP pipeline
        id: contracts
        # Still compile the release app if a runtime contract fails, so both
        # independent results are available. The final gate preserves failure.
        continue-on-error: true
        run: >-
          fvm flutter test --no-pub
          test/features/scripting/runtime/native_runtime_test.dart
          test/features/scripting/runtime/script_api_test.dart
          test/features/scripting/runtime/script_tests_test.dart
          test/features/scripting/runtime/script_secret_values_test.dart
          test/features/scripting/runtime/script_snippets_test.dart
          test/scripts_pipeline_integration_test.dart
      - name: Build desktop release
        env:
          # Same MSVC compatibility define as the existing release build.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: fvm flutter build ${{ matrix.platform }} --release --no-pub
      - name: Verify macOS universal app and native engine
        if: runner.os == 'macOS'
        run: |
          app=build/macos/Build/Products/Release/getman.app
          for binary in \
            "$app/Contents/MacOS/getman" \
            "$app/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS" \
            "$app/Contents/Frameworks/App.framework/Versions/A/App" \
            "$app/Contents/Frameworks/getman_quickjs.framework/getman_quickjs"; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch arm64
            lipo "$binary" -verify_arch x86_64
          done
      - name: Verify Linux native engine bundle
        if: runner.os == 'Linux'
        run: test -n "$(find build/linux/x64/release/bundle -name '*getman_quickjs*.so' -print -quit)"
      - name: Verify Windows native engine bundle
        if: runner.os == 'Windows'
        run: test -n "$(find build/windows/x64/runner/Release -name '*getman_quickjs*.dll' -print -quit)"
      - name: Require native contracts to pass
        if: steps.contracts.outcome != 'success'
        run: exit 1
